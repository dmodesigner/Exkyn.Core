# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Pacote Exkyn Core

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  PASTA: ${{ github.workspace }}/output

permissions:
  id-token: write
  contents: read
  
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore
            
      - name: Build da Solução
        run: dotnet build --configuration Release --no-restore

      - name: Pack com Versionamento Automático
        run: dotnet pack ./Src/Exkyn.Core/Exkyn.Core.csproj --configuration Release --no-build -p:PackageVersion=10.0.${{ github.run_number }} --output ./nupkg

      - name: Obter token temporário do NuGet
        if: github.event_name == 'push'
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push para o NuGet.org
        if: github.event_name == 'push'
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
